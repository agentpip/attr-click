# Example attr.click application vhost. Set the document root for your host
# before installing it. Caddy remains the public TLS edge and proxies requests
# to this Apache listener over loopback only.
<VirtualHost 127.0.0.1:8092>
    ServerName attr.click
    ServerAlias www.attr.click
    DocumentRoot /srv/attr-click/public

    <Directory /srv/attr-click/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        DirectoryIndex index.php
        Require all granted

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [L]
    </Directory>

    SetEnvIfNoCase ^Authorization$ "(.+)" HTTP_AUTHORIZATION=$1
    SetEnvIfNoCase ^X-XSRF-TOKEN$ "(.+)" HTTP_X_XSRF_TOKEN=$1
    SetEnvIfNoCase ^X-Forwarded-Proto$ "https$" HTTPS=on

    ErrorLog ${APACHE_LOG_DIR}/attr_click_error.log
    CustomLog ${APACHE_LOG_DIR}/attr_click_access.log combined
</VirtualHost>
